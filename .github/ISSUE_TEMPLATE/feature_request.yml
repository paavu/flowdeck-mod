name: Feature request
description: An idea for something FlowDeck could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What FlowDeck could do about it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
