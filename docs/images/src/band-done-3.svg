<svg xmlns="http://www.w3.org/2000/svg" width="32" height="22" viewBox="0 0 32 22">
<style>
.run .pa,.run .pb{opacity:0}
.run .pa{animation:fa .8s steps(1) infinite}.run .pb{animation:fb .8s steps(1) infinite}.run .pr{animation:fr .8s steps(1) infinite}
.run .bd{animation:bob .8s steps(1) infinite}
@keyframes fa{0%{opacity:1}25%{opacity:0}}@keyframes fb{0%{opacity:0}50%{opacity:1}75%{opacity:0}}
@keyframes fr{0%{opacity:0}25%{opacity:1}50%{opacity:0}75%{opacity:1}}
@keyframes bob{0%,50%{transform:translateY(-1px)}25%,75%{transform:none}}
@media (prefers-reduced-motion: reduce){.run .bd,.run .pa,.run .pb,.run .pr{animation:none!important}.run .pa,.run .pb{opacity:0}.run .pr{opacity:1}}
