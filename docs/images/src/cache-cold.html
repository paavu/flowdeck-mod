<!doctype html><html><head><meta charset="utf-8"><title>flowdeck sample</title><style>
:root{--bg:#faf9f5;--ink:#1f1f1f;--line:#e6e4dd;--button:#f0eee6}@media (prefers-color-scheme: dark){:root{--bg:#262624;--ink:#ececec;--line:#3a3a37;--button:#30302e}}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:13px/18px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.frame{position:relative;width:760px;padding:28px;box-sizing:content-box}
.text{display:inline-block}
.btn{display:inline-block;white-space:nowrap;padding:1px 8px;border:1px solid var(--line);border-radius:6px;background:var(--button);flex-shrink:0}
.btn.plain{padding:0 2px;border-color:transparent;background:none}
.part+.part{margin-top:34px}
.leaders{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.leaders line{stroke:#d6249f;stroke-width:1.5}
.leaders circle{fill:#d6249f}
.cap{font-size:11px;opacity:.55;margin-bottom:4px}
.mark{position:absolute;width:18px;height:18px;border-radius:50%;background:#d6249f;color:#fff;font:700 11px/18px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px var(--bg);z-index:2}

    const cy = (r.top + r.bottom) / 2

    d.style.top = `${y - R}px`
