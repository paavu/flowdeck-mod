:root{--bg:#faf9f5;--ink:#1f1f1f;--line:#e6e4dd;--button:#f0eee6}@media (prefers-color-scheme: dark){:root{--bg:#262624;--ink:#ececec;--line:#3a3a37;--button:#30302e}}

  frame.appendChild(overlay)
  const rectOf = c => {

    }
    if (c.text) {
      const drawn = [...scope.querySelectorAll('img')].find(i => i.alt.includes(c.text))

      for (let t = walk.nextNode(); t; t = walk.nextNode()) {
        const found = pattern ? pattern.exec(t.nodeValue) : null
